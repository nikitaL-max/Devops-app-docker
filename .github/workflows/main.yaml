name: Build, Test, and Push Docker Image

on:
  push:
    branches: [ "main" ] 

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: BUILD local image for testing
      - name: Build Docker Image Locally
        run: docker build -t test-image .

      # Step 3: TEST the container response
      - name: Test Container HTTP Response
        run: |
          docker run -d -p 8080:80 --name test-container test-image
          sleep 3
          curl --fail http://localhost:8080 || exit 1
          docker stop test-container
          docker rm test-container

      # Step 4: Login to Docker Hub (Only after test succeeds)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: PUSH finished image to Docker Hub
      - name: Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-nginx-site:latest